      function removeDiacritics(text) {
        const map = { 'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ó':'O','Ś':'S','Ź':'Z','Ż':'Z' };
        return String(text).replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => map[c] || c);
      }

      // Check if restaurant is currently open in Poland timezone
      function isRestaurantOpenNow(rest) {
        if (!rest.hours) return true;
        const now = new Date();
        // Convert to Poland time (Europe/Warsaw)
        const dayMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const dayKey = dayMap[now.getDay()];
        const range = rest.hours[dayKey];
        if (!range || range === 'Zamknięte' || range.includes('rezerwacji')) return false;

        const match = range.match(/(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
        if (!match) return true;

        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const startMinutes = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
        let endMinutes = parseInt(match[3], 10) * 60 + parseInt(match[4], 10);
        if (endMinutes <= startMinutes) {
          // Crosses midnight, e.g. 10:00-01:00
          endMinutes += 24 * 60;
        }

        return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
      }

        el.innerHTML = `

        searchQuery = '';
        activeCategory = 'Wszystkie';
        filterDelivery = false;
        filterTakeaway = false;
        filterOpenNow = false;
        render();
      }

      function setOrderType(type) {
        orderType = type;
        saveCart();
        render();
      }

      function addToCart(restId, itemId, name, price) {
        if (cartRestId && cartRestId !== restId && cart.length > 0) {
          if (!confirm('Masz w koszyku pozycje z innego lokalu. Czy chcesz wyczyścić koszyk i rozpocząć zamówienie w nowym lokalu?')) {
            return;
          }
          cart = [];
        }
        cartRestId = restId;
        const existing = cart.find(i => i.id === itemId);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id: itemId, name, price, qty: 1 });
        }
        saveCart();
        showToast('Dodano: ' + name);
        render();
      }

      function updateQty(itemId, delta) {
        const item = cart.find(i => i.id === itemId);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== itemId);
          if (cart.length === 0) cartRestId = null;
        }
        saveCart();
        render();
      }

      function openCart() {
        isCartOpen = true;
        render();
      }

      function closeCart() {
        isCartOpen = false;
        render();
      }

      function setStreetInput(street) {
        const inp = document.getElementById('cust-address');
        if (inp) {
          inp.value = street + ' ';
          inp.focus();
        }
      }

      function submitSMSOrder(restId) {
        const rest = RESTAURANTS.find(r => r.id === restId);
        if (!rest) return;

        const name = (document.getElementById('cust-name')?.value || '').trim();
        const phone = (document.getElementById('cust-phone')?.value || '').trim();
        const address = (document.getElementById('cust-address')?.value || '').trim();
        const notes = (document.getElementById('cust-notes')?.value || '').trim();

        if (!name) { showToast('Wpisz swoje imię i nazwisko!', 'info'); return; }
        if (!phone) { showToast('Wpisz numer telefonu!', 'info'); return; }
        if (orderType === 'delivery' && !address) { showToast('Podaj ulicę i numer domu w Rogoźnie!', 'info'); return; }

        const totalItemsPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        if (totalItemsPrice < rest.minOrder) {
          showToast('Minimalna kwota zamówienia to ' + rest.minOrder + ' zł!', 'info');
          return;
        }

        const deliveryFee = (orderType === 'delivery' && rest.hasDelivery) ? rest.deliveryFee : 0;
        const finalPrice = totalItemsPrice + deliveryFee;

        // Build clean SMS text adhering to 7-bit GSM standard
        const lines = [
          'ZAMOWIENIE ROGOZNO JE',
          'Lokal: ' + removeDiacritics(rest.name),
          'Typ: ' + (orderType === 'delivery' ? 'DOSTAWA DO DOMU' : 'ODBIOR OSOBISTY W LOKALU'),
          '------------------------'
        ];

        cart.forEach(i => {
          lines.push(`${i.qty}x ${removeDiacritics(i.name)} (${i.price * i.qty} zl)`);
        });

        lines.push('------------------------');
        if (orderType === 'delivery') {
          lines.push(`Dostawa: ${deliveryFee} zl`);
        }
        lines.push(`DO ZAPLATY: ${finalPrice} zl`);
        lines.push('');
        lines.push('DANE ZAMAWIAJACEGO:');
        lines.push('Klient: ' + removeDiacritics(name));
        lines.push('Tel: ' + phone);
        if (orderType === 'delivery') {
          lines.push('Adres: ' + removeDiacritics(address) + ', Rogozno');
        }

        if (notes) {
          lines.push('Uwagi: ' + removeDiacritics(notes));
        }

        const smsText = lines.join('\n');
        const cleanPhone = rest.phone.replace(/[^0-9+]/g, '');

        // iOS vs Android link compatibility
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
        const sep = isIOS ? '&' : '?';
        const smsUrl = `sms:${cleanPhone}${sep}body=${encodeURIComponent(smsText)}`;

        // Copy to clipboard silently
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(smsText).catch(() => {});
        }

        orderModalData = {
          text: smsText,
          smsUrl: smsUrl,
          phone: cleanPhone,
          restName: rest.name
        };

        render();
      }

      function closeOrderModal() {
        orderModalData = null;
        render();
      }

      function copySMSText(encText) {
        const text = decodeURIComponent(encText);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => showToast('Treść zamówienia została skopiowana!'));
        }
      }

      // INITIAL BOOT
      window.addEventListener('DOMContentLoaded', () => {
        render();
      });
      render();
    </script>
  </body>
</html>
