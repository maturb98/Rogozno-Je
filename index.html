        return text.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => map[c] || c);

      // ACTIONS
      function goHome() {
        activeRestaurant = null;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openRestaurant(id) {
        activeRestaurant = RESTAURANTS.find(r => r.id === id);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function setSearch(val) {
        searchQuery = val;
        render();
      }

      function setCategory(cat) {
        activeCategory = cat;
        render();
      }

      function toggleFilterDelivery() {
        filterDelivery = !filterDelivery;
        render();
      }

      function toggleFilterTakeaway() {
        filterTakeaway = !filterTakeaway;
        render();
      }

      function addToCart(restId, itemId, name, price) {
        if (cartRestId && cartRestId !== restId && cart.length > 0) {
          if (!confirm('Masz w koszyku pozycje z innego lokalu. Czy chcesz wyczyścić koszyk i rozpocząć nowe zamówienie?')) {
            return;
          }
          cart = [];
        }
        cartRestId = restId;
        const existing = cart.find(i => i.id === itemId);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id: itemId, name, price, qty: 1 });
        }
        saveCart();
        render();
      }

      function updateQty(itemId, delta) {
        const item = cart.find(i => i.id === itemId);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== itemId);
          if (cart.length === 0) cartRestId = null;
        }
        saveCart();
        render();
      }

      function openCart() {
        isCartOpen = true;
        render();
      }

      function closeCart() {
        isCartOpen = false;
        render();
      }

      function setStreetInput(street) {
        const inp = document.getElementById('cust-address');
        if (inp) {
          inp.value = street + ' ';
          inp.focus();
        }
      }

      function submitSMSOrder(restId) {
        const rest = RESTAURANTS.find(r => r.id === restId);
        if (!rest) return;

        const name = (document.getElementById('cust-name')?.value || '').trim();
        const phone = (document.getElementById('cust-phone')?.value || '').trim();
        const address = (document.getElementById('cust-address')?.value || '').trim();
        const notes = (document.getElementById('cust-notes')?.value || '').trim();

        if (!name) { alert('Podaj swoje imię!'); return; }
        if (!phone) { alert('Podaj swój numer telefonu!'); return; }
        if (!address) { alert('Podaj ulicę i numer lokalu w Rogoźnie!'); return; }

        const totalItemsPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        if (totalItemsPrice < rest.minOrder) {
          alert('Minimalna kwota zamówienia w ' + rest.name + ' to ' + rest.minOrder + ' zł!');
          return;
        }

        const deliveryFee = rest.hasDelivery ? rest.deliveryFee : 0;
        const finalPrice = totalItemsPrice + deliveryFee;

        // Build clean SMS text adhering to 7-bit GSM standard
        const lines = [
          'ROGOZNO JE',
          '',
          removeDiacritics(rest.name),
          ''
        ];

        cart.forEach(i => {
          lines.push(`${i.qty}x ${removeDiacritics(i.name)} - ${i.price * i.qty} zl`);
        });

        lines.push('');
        lines.push(`Dostawa: ${deliveryFee} zl`);
        lines.push(`RAZEM: ${finalPrice} zl`);
        lines.push('');
        lines.push('DOSTAWA:');
        lines.push(removeDiacritics(name));
        lines.push(removeDiacritics(address));
        lines.push('Rogozno');
        lines.push(`Tel: ${phone}`);

        if (notes) {
          lines.push('');
          lines.push(`Uwagi: ${removeDiacritics(notes)}`);
        }

        const smsText = lines.join('\n');
        const cleanPhone = rest.phone.replace(/[^0-9+]/g, '');

        // iOS vs Android link compatibility
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
        const sep = isIOS ? '&' : '?';
        const smsUrl = `sms:${cleanPhone}${sep}body=${encodeURIComponent(smsText)}`;

        // Copy to clipboard silently
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(smsText).catch(() => {});
        }

        orderModalData = {
          text: smsText,
          smsUrl: smsUrl,
          phone: cleanPhone
        };

        render();
      }

      function closeOrderModal() {
        orderModalData = null;
        render();
      }

      function copySMSText(encText) {
        const text = decodeURIComponent(encText);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => alert('Treść zamówienia została skopiowana!'));
        }
      }

      // INITIAL BOOT
      window.addEventListener('DOMContentLoaded', () => {
        render();
      });
      render();
    </script>
  </body>
</html>
