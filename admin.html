            { id: 'm15-1', name: 'Maybest Kebab w Bułce z Serem', desc: 'Opiekane mięso kebab, stopiony cheddar, świeże warzywa, sos czosnkowo-pikantny.', price: 26, cat: 'Kebab' },
            { id: 'm15-2', name: 'Maybest Burger Wołowy z Bekonem', desc: 'Wołowina 150g, chrupiący bekon, sałata, plaster pomidora, sos BBQ.', price: 29, cat: 'Burgery' },
            { id: 'm15-3', name: 'Kapsalon Maybest z Serem', desc: 'Zapiekana porcja frytek z mięsem kebab, serem gouda i sosem tatarskim.', price: 31, cat: 'Kebab' }
          ]
        }
      ];

      // STORE
      let RESTAURANTS = (() => {
        try {
          const stored = localStorage.getItem('rogozno_restaurants_v4');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return RESTAURANTS_INITIAL;
      })();

      function saveStore() {
        localStorage.setItem('rogozno_restaurants_v4', JSON.stringify(RESTAURANTS));
      }

      // STATE
      let currentView = 'list'; // 'list' | 'edit' | 'backup'
      let selectedRestId = RESTAURANTS[0]?.id || null;
      let isCreatingNew = false;
      let editingDishId = null;
      let isAddingNewDish = false;

      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        el.className = `toast-msg flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white transition-all backdrop-blur-md ${
          type === 'info' ? 'bg-slate-900/95 border border-slate-700' : 'bg-brand-900/95 border border-brand-700/60'
        }`;
        el.innerHTML = `
          <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center shrink-0">
            <i data-lucide="${type === 'info' ? 'info' : 'check'}" class="w-3.5 h-3.5 text-white"></i>
          </div>
          <span>${message}</span>
        `;
        container.appendChild(el);
        lucide.createIcons();

        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(10px) scale(0.95)';
          setTimeout(() => el.remove(), 250);
        }, 2200);
      }

      function updateNavTabs() {
        document.getElementById('nav-count').innerText = RESTAURANTS.length;
        
        ['list', 'edit', 'backup'].forEach(view => {
          const btn = document.getElementById('nav-' + view);
          if (!btn) return;
          if (currentView === view) {
            btn.className = 'nav-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 text-white shadow-xs';
          } else {
            btn.className = 'nav-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100';
          }
        });

        const activeRest = RESTAURANTS.find(r => r.id === selectedRestId);
        const editLabel = document.getElementById('nav-edit-label');
        if (editLabel) {
          editLabel.innerText = isCreatingNew ? 'Nowy lokal' : (activeRest ? 'Edycja: ' + activeRest.name : 'Szczegóły lokalu');
        }
      }

      function setView(view) {
        currentView = view;
        render();
      }

      function openEditView(id) {
        selectedRestId = id;
        isCreatingNew = false;
        currentView = 'edit';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openNewRestView() {
        isCreatingNew = true;
        selectedRestId = null;
        currentView = 'edit';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function render() {
        updateNavTabs();
        const root = document.getElementById('admin-root');
        if (!root) return;

        if (currentView === 'list') {
          root.innerHTML = renderListView();
        } else if (currentView === 'edit') {
          root.innerHTML = renderEditView();
        } else if (currentView === 'backup') {
          root.innerHTML = renderBackupView();
        }

        lucide.createIcons();
      }

      // 1. LIST VIEW
      function renderListView() {
        return `
          <div class="space-y-6">
            <!-- Header bar -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-3xl border border-slate-200 shadow-2xs">
              <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Katalog lokali w Rogoźnie</h1>

              </div>

              <div class="flex items-center gap-2">

              ${RESTAURANTS.map((r, idx) => `

                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        const days = [

      // 3. BACKUP AND DATABASE VIEW

          <div class="space-y-6">

                <p class="text-xs text-slate-500">Pobierz pełną bazę wszystkich restauracji, menu i godzin na dysk.</p>
                <button onclick="downloadBackupJSON()" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-black text-white font-bold text-xs flex items-center justify-center gap-2">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  <span>Pobierz rogozno_je_katalog.json</span>
                </button>
              </div>

              <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-700">
                  <i data-lucide="upload" class="w-5 h-5"></i>
                </div>
                <h3 class="font-extrabold text-sm text-slate-900">Importuj dane z pliku</h3>
                <p class="text-xs text-slate-500">Wgraj przygotowany plik JSON, aby natychmiast zaktualizować całą bazę.</p>
                <label class="w-full py-2.5 px-4 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-800 font-bold text-xs flex items-center justify-center gap-2 cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                  <span>Wybierz plik JSON</span>
                  <input type="file" accept=".json" onchange="importJSONFile(event)" class="hidden" />
                </label>
              </div>

              <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3">
                <div class="w-10 h-10 rounded-2xl bg-red-50 flex items-center justify-center text-red-700">
                  <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </div>
                <h3 class="font-extrabold text-sm text-slate-900">Przywróć stan początkowy</h3>
                <p class="text-xs text-slate-500">Resetuje wszystkie zmiany do oryginalnych 15 lokali z pliku CSV.</p>
                <button onclick="resetToInitialCatalog()" class="w-full py-2.5 px-4 rounded-xl bg-red-800 hover:bg-red-900 text-white font-bold text-xs flex items-center justify-center gap-2">
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                  <span>Przywróć 15 lokali</span>
                </button>
              </div>
            </div>

            <!-- JSON Preview Box -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="font-black text-sm text-slate-900">Podgląd kodu bazy JSON (${RESTAURANTS.length} lokali):</h3>
                <button onclick="copyCatalogJSON()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  <span>Kopiuj do schowka</span>
                </button>
              </div>
              <textarea readonly class="w-full h-80 p-4 font-mono text-xs bg-slate-900 text-emerald-400 rounded-2xl border border-slate-800 overflow-y-auto leading-relaxed">${jsonStr}</textarea>
            </div>
          </div>
        `;
      }

      // DISH EDIT MODAL
      function renderDishModal() {
        const rest = RESTAURANTS.find(r => r.id === selectedRestId);
        const dish = isAddingNewDish ? null : rest?.menu.find(m => m.id === editingDishId);

        return `
          <div class="fixed inset-0 z-60 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs">
            <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl border border-slate-200 space-y-4">
              <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                <h3 class="font-black text-base text-slate-900">${isAddingNewDish ? 'Nowa pozycja w menu' : 'Edytuj danie'}</h3>
                <button onclick="editingDishId = null; isAddingNewDish = false; render();" class="p-1 text-slate-400 hover:text-slate-700">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>
              </div>

              <form onsubmit="event.preventDefault(); submitDishForm();" class="space-y-3 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Nazwa potrawy *</label>
                  <input id="dish-name" type="text" value="${dish ? dish.name : ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-800" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Cena (zł) *</label>
                    <input id="dish-price" type="number" step="0.5" min="1" value="${dish ? dish.price : 25}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-800" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Kategoria</label>
                    <input id="dish-cat" type="text" value="${dish ? (dish.cat || 'Obiady') : 'Obiady'}" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-800" />
                  </div>
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">Etykieta (np. Bestseller, Ostre)</label>
                  <input id="dish-tag" type="text" value="${dish ? (dish.tag || '') : ''}" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-800" />
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">Składniki i opis</label>
                  <textarea id="dish-desc" rows="3" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-800">${dish ? dish.desc : ''}</textarea>
                </div>

                <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                  <button type="button" onclick="editingDishId = null; isAddingNewDish = false; render();" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-bold">Anuluj</button>
                  <button type="submit" class="px-5 py-2 rounded-xl bg-brand-800 text-white font-bold hover:bg-brand-900">Zapisz danie</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // ACTIONS
      function submitRestaurantFullForm() {
        const name = (document.getElementById('edit-name')?.value || '').trim();
        const phone = (document.getElementById('edit-phone')?.value || '').trim();
        const address = (document.getElementById('edit-address')?.value || '').trim();
        const cuisines = (document.getElementById('edit-cuisines')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        const badge = (document.getElementById('edit-badge')?.value || '').trim();
        const desc = (document.getElementById('edit-desc')?.value || '').trim();
        const minOrder = parseFloat(document.getElementById('edit-min')?.value || '30');
        const deliveryFee = parseFloat(document.getElementById('edit-fee')?.value || '5');
        const time = (document.getElementById('edit-time')?.value || '30-45 min').trim();
        const rating = parseFloat(document.getElementById('edit-rating')?.value || '4.5');
        const hasDelivery = document.getElementById('edit-has-del')?.checked ?? true;
        const hasTakeaway = document.getElementById('edit-has-take')?.checked ?? true;

        if (!name || !phone || !address) {
          showToast('Wypełnij nazwę, telefon i adres lokalu!', 'info');
          return;
        }

        const hours = {
          mon: document.getElementById('hour-mon')?.value || '12:00-21:00',
          tue: document.getElementById('hour-tue')?.value || '12:00-21:00',
          wed: document.getElementById('hour-wed')?.value || '12:00-21:00',
          thu: document.getElementById('hour-thu')?.value || '12:00-21:00',
          fri: document.getElementById('hour-fri')?.value || '12:00-22:00',
          sat: document.getElementById('hour-sat')?.value || '12:00-22:00',
          sun: document.getElementById('hour-sun')?.value || '12:00-20:00',
        };

        if (isCreatingNew) {
          const newId = 'rest-' + Date.now();
          const newRest = {
            id: newId,
            name,
            slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
            phone,
            address,
            cuisines: cuisines.length > 0 ? cuisines : ['Obiady'],
            minOrder,
            deliveryFee,
            time,
            rating,
            reviews: 1,
            hasDelivery,
            hasTakeaway,
            badge,
            desc,
            hours,
            menu: []
          };
          RESTAURANTS.push(newRest);
          selectedRestId = newId;
          isCreatingNew = false;
          showToast('Dodano nowy lokal: ' + name);
        } else {
          const rest = RESTAURANTS.find(r => r.id === selectedRestId);
          if (rest) {
            rest.name = name;
            rest.phone = phone;
            rest.address = address;
            rest.cuisines = cuisines.length > 0 ? cuisines : rest.cuisines;
            rest.badge = badge;
            rest.desc = desc;
            rest.minOrder = minOrder;
            rest.deliveryFee = deliveryFee;
            rest.time = time;
            rest.rating = rating;
            rest.hasDelivery = hasDelivery;
            rest.hasTakeaway = hasTakeaway;
            rest.hours = hours;
            showToast('Zapisano zmiany dla ' + name);
          }
        }

        saveStore();
        render();
      }

      function deleteRestaurant(id) {
        const rest = RESTAURANTS.find(r => r.id === id);
        if (!rest) return;
        if (!confirm('Czy na pewno chcesz bezpowrotnie usunąć lokal "' + rest.name + '" z bazy?')) return;

        RESTAURANTS = RESTAURANTS.filter(r => r.id !== id);
        if (selectedRestId === id) selectedRestId = RESTAURANTS[0]?.id || null;
        saveStore();
        showToast('Usunięto lokal ' + rest.name);
        render();
      }

      function openAddDishForm(restId) {
        selectedRestId = restId;
        isAddingNewDish = true;
        editingDishId = null;
        render();
      }

      function openEditDishForm(restId, dishId) {
        selectedRestId = restId;
        isAddingNewDish = false;
        editingDishId = dishId;
        render();
      }

      function submitDishForm() {
        const rest = RESTAURANTS.find(r => r.id === selectedRestId);
        if (!rest) return;

        const name = (document.getElementById('dish-name')?.value || '').trim();
        const price = parseFloat(document.getElementById('dish-price')?.value || '25');
        const cat = (document.getElementById('dish-cat')?.value || 'Obiady').trim();
        const tag = (document.getElementById('dish-tag')?.value || '').trim();
        const desc = (document.getElementById('dish-desc')?.value || '').trim();

        if (!name || isNaN(price)) {
          showToast('Podaj nazwę i poprawną cenę!', 'info');
          return;
        }

        if (isAddingNewDish) {
          const newDishId = 'd-' + Date.now();
          rest.menu.push({ id: newDishId, name, price, cat, tag, desc });
          showToast('Dodano: ' + name);
        } else {
          const dish = rest.menu.find(m => m.id === editingDishId);
          if (dish) {
            dish.name = name;
            dish.price = price;
            dish.cat = cat;
            dish.tag = tag;
            dish.desc = desc;
            showToast('Zaktualizowano danie: ' + name);
          }
        }

        saveStore();
        editingDishId = null;
        isAddingNewDish = false;
        render();
      }

      function deleteDish(restId, dishId) {
        const rest = RESTAURANTS.find(r => r.id === restId);
        if (!rest) return;
        const dish = rest.menu.find(m => m.id === dishId);
        if (!dish) return;
        if (!confirm('Usunąć danie "' + dish.name + '"?')) return;

        rest.menu = rest.menu.filter(m => m.id !== dishId);
        saveStore();
        showToast('Usunięto: ' + dish.name);
        render();
      }

      function downloadBackupJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(RESTAURANTS, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "rogozno_je_katalog.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Pobrano plik rogozno_je_katalog.json');
      }

      function copyCatalogJSON() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(JSON.stringify(RESTAURANTS, null, 2))
            .then(() => showToast('Skopiowano kod JSON do schowka!'));
        }
      }

      function importJSONFile(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (Array.isArray(data) && data.length > 0) {
              RESTAURANTS = data;
              saveStore();
              selectedRestId = RESTAURANTS[0]?.id;
              showToast('Zaimportowano ' + data.length + ' lokali!');
              render();
            } else {
              showToast('Niepoprawny format pliku JSON!', 'info');
            }
          } catch (err) {
            showToast('Błąd parsowania pliku JSON!', 'info');
          }
        };
        reader.readAsText(file);
      }

      function resetToInitialCatalog() {
        if (!confirm('Czy na pewno chcesz przywrócić oryginalne 15 restauracji z Rogoźna? Spowoduje to nadpisanie obecnych danych.')) return;
        RESTAURANTS = JSON.parse(JSON.stringify(RESTAURANTS_INITIAL));
        saveStore();
        selectedRestId = RESTAURANTS[0]?.id;
        showToast('Przywrócono 15 oryginalnych lokali!');
        render();
      }

      // INITIAL LOAD
      window.addEventListener('DOMContentLoaded', () => {
        render();
      });
      render();
    </script>
  </body>
</html>
