server {
    listen 80;
    server_name rogozno-je.pl www.rogozno-je.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rogozno-je.pl www.rogozno-je.pl;

    # SSL certificates managed by Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/rogozno-je.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rogozno-je.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location /static/ {
        alias /var/www/rogozno-je/python_backend/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # PWA Manifest and Service Worker
    location /manifest.json {
        alias /var/www/rogozno-je/python_backend/app/static/manifest.json;
        add_header Content-Type application/manifest+json;
    }

    location /sw.js {
        alias /var/www/rogozno-je/python_backend/app/static/sw.js;
        add_header Cache-Control "no-cache";
    }

    # Gunicorn reverse proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
